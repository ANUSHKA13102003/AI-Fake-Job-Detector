services:
  # ── 1. Python AI Model ────────────────────────────────────────────────────
  - type: web
    name: ai-model
    runtime: python
    rootDir: ai-model
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    plan: free
    healthCheckPath: /health

  # ── 2. Node Backend ───────────────────────────────────────────────────────
  - type: web
    name: ai-fake-job-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── 3. React Frontend (static site) ──────────────────────────────────────
  - type: static_site
    name: ai-fake-job-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: build
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: CI
        value: "false"
      - key: GENERATE_SOURCEMAP
        value: "false"